name: Update TWSE Listed Companies

on:
  schedule:
    - cron: '0 0 1 1,4,7,10 *'  # 每季初第一天凌晨 0 點執行
  workflow_dispatch:             # 也可以手動觸發

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests pandas openpyxl

      - name: Download company list
        run: python scripts/download_companies.py

      - name: Commit and push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add data/
          git commit -m "Update TWSE company list - $(date +%Y-%m-%d)" || echo "No changes to commit"
          git push
